name: Check and publish Quartermaster

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pinned npm (no lifecycle scripts)
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          npm install --global "npm@$npm_version" --ignore-scripts --min-release-age=7 --registry=https://registry.npmjs.org/
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # Findings and registry failures block publishing.
      - name: Audit dependencies
        run: npm run audit
      - name: Check types
        run: npm run check
      - name: Test calculations, CSV safety, and draft storage
        run: npm test
      - name: Build static pages
        run: npm run build
      - name: Package the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
